name: Desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # The backend stores data with Windows DPAPI, so its tests run on Windows.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match the Python version that the packaged worker is built with.
          python-version: '3.14'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: python -m pip install -r interface/desktop/backend/requirements.lock.txt
      - name: Backend tests
        working-directory: interface/desktop/backend
        run: python -m unittest discover -p "test_*.py"
      - name: Developer script tests
        run: python -m unittest scripts/test_discover_list_hosts.py scripts/test_probe_list_page_size.py scripts/test_watch_instagram_exports.py scripts/test_release_notes.py
      - name: Offline backend check
        run: python scripts/test-backend-offline.py
      - name: Desktop interface tests
        working-directory: interface
        run: node --test "desktop/*.test.cjs"
      - name: Shared source checks
        working-directory: interface
        run: npm run check
