name: Windows release
# Builds the portable Windows app from this commit on a clean GitHub runner,
# tests the packaged EXE, signs it when SignPath is configured, and publishes
# a provenance attestation with a *draft* release. A maintainer reviews the
# draft and publishes it by hand; nothing reaches users automatically.
on:
  push:
    tags: ['windows-v*']
  pull_request:
    paths:
      - .github/workflows/release-windows.yml
      - interface/desktop/backend/build-worker.ps1
      - interface/desktop/backend/*requirements.lock.txt
      - interface/scripts/package-functional-desktop.mjs
      - interface/scripts/brand-windows.mjs
      - packaging/**
      - scripts/release-notes.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # SignPath reads the uploaded unsigned artifact.
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && (startsWith(github.ref, 'refs/tags/windows-v') || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          # The worker is frozen with Python 3.14; build-worker.ps1 refuses others.
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content interface/package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            python scripts/release-notes.py $version --tag $env:GITHUB_REF_NAME > $null
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      # One command per step: a multi-line pwsh step only fails on its last command.
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r interface/desktop/backend/requirements.lock.txt -r interface/desktop/backend/build-requirements.lock.txt
      - name: Install interface dependencies
        run: npm ci --prefix interface
      # npm on the runner does not run install scripts, so fetch Electron's
      # runtime explicitly; the version comes from package-lock.json.
      - name: Download Electron runtime
        run: node interface/node_modules/electron/install.js
      - name: Backend tests
        working-directory: interface/desktop/backend
        run: python -m unittest discover -p "test_*.py"
      - name: Release script tests
        run: python -m unittest scripts/test_release_notes.py
      - name: Shared source checks
        run: npm run check --prefix interface
      - name: Build worker
        shell: pwsh
        env:
          TRACKER_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./interface/desktop/backend/build-worker.ps1
      - name: Package
        run: npm run package:functional --prefix interface

      - name: Upload unsigned package for signing
        if: env.SIGNING == 'true'
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-Followtrail-Desktop-${{ steps.version.outputs.version }}
          path: artifacts/Followtrail-Desktop-${{ steps.version.outputs.version }}
          retention-days: 1
      - name: Sign with SignPath
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Use signed files
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $target = "artifacts/Followtrail-Desktop-${{ steps.version.outputs.version }}"
          Remove-Item -Recurse -Force $target
          Move-Item signed $target
          foreach ($file in "$target/Followtrail.exe", "$target/resources/app/worker/tracker-worker.exe") {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed: $($signature.Status)" }
            "$file signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Test packaged app
        env:
          TRACKER_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run check:functional --prefix interface
      - name: Test packaged ZIP review
        env:
          TRACKER_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node interface/scripts/check-zip-archive-desktop.mjs
      - name: Create release archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $name = "Followtrail-Desktop-$version"
          New-Item -ItemType Directory -Force release | Out-Null
          # Keep the top folder so the ZIP extracts into its own directory.
          Compress-Archive -Path "artifacts/$name" -DestinationPath "release/$name.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "release/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/release/SHA256SUMS.txt", "$hash  $name.zip`n")
          Get-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/Followtrail-Desktop-${{ needs.build.outputs.version }}.zip
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 scripts/release-notes.py "$VERSION" --tag "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "Windows $VERSION" --notes-file notes.md
