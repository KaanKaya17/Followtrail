name: Web viewer checks
# The browser viewer must read exports exactly like the desktop app: the parity
# test runs the Python reader and the JavaScript reader on the same random ZIPs.
on:
  push:
    branches: [main]
    paths:
      - viewer/**
      - interface/desktop/backend/instagram_archive.py
      - interface/desktop/backend/export_browser.py
      - .github/workflows/viewer.yml
  pull_request:
    paths:
      - viewer/**
      - interface/desktop/backend/instagram_archive.py
      - interface/desktop/backend/export_browser.py
      - .github/workflows/viewer.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viewer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Only playwright-core is needed; skip Electron's download script.
      - name: Install test dependencies
        run: npm ci --prefix interface --ignore-scripts
      - name: Unit and parity tests
        env:
          PYTHON: python
          PARITY_CASES: '400'
        run: node --test "viewer/test/*.test.mjs"
      - name: Browser check
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node viewer/test/browser.check.mjs
