LicenseUrl: https://github.com/KaanKaya17/Followtrail/blob/main/LICENSE
ShortDescription: Local, open-source tool for reviewing your Instagram data export and follow history.
Description: |-
  Followtrail opens the ZIP you download from Instagram's "Download your information" on your own computer:
  followers and following with dates, close friends, pending requests, a comparison of two exports and
  insights about your own activity. ZIP mode sends no requests and the file never leaves the device.
  An optional account mode records changes in your own follow lists over time; it uses interfaces Instagram
  does not officially offer and may conflict with Instagram's terms. Records are encrypted with Windows DPAPI.
  Followtrail is not affiliated with Instagram or Meta.
